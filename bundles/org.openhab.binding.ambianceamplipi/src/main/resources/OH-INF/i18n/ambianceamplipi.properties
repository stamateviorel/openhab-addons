# add-on

addon.ambianceamplipi.name = Ambiance AmpliPi Binding
addon.ambianceamplipi.description = Whole-house radio, Spotify Connect, announcements and alarm for an Ambiance AmpliPi controller (a stripped AmpliPi derivative). Per-zone volume/mute/power with zone auto-discovery, playback-source switching, station selection, now-playing + album art, a public-address audio sink for Voice.say, and a burglar-siren switch.

# thing types

thing-type.ambianceamplipi.controller.label = Ambiance AmpliPi Controller
thing-type.ambianceamplipi.controller.description = An Ambiance AmpliPi controller (radio + announcements + alarm).
thing-type.ambianceamplipi.zone.label = Ambiance AmpliPi Zone
thing-type.ambianceamplipi.zone.description = A zone of the Ambiance AmpliPi system.

# thing types config

thing-type.config.ambianceamplipi.controller.hostname.label = Hostname
thing-type.config.ambianceamplipi.controller.hostname.description = Hostname or IP address of the Ambiance AmpliPi controller.
thing-type.config.ambianceamplipi.controller.port.label = Port
thing-type.config.ambianceamplipi.controller.port.description = HTTP API port.
thing-type.config.ambianceamplipi.controller.refreshInterval.label = Refresh Interval
thing-type.config.ambianceamplipi.controller.refreshInterval.description = Interval the controller is polled, in seconds.
thing-type.config.ambianceamplipi.zone.id.label = Zone ID
thing-type.config.ambianceamplipi.zone.id.description = The ID of the zone (0-based).

# channel types

channel-type.ambianceamplipi.announce.label = Announce
channel-type.ambianceamplipi.announce.description = URL of audio to play as a public-address announcement.
channel-type.ambianceamplipi.cover.label = Album art
channel-type.ambianceamplipi.cover.description = Current album art (fetched by the controller from the now-playing metadata).
channel-type.ambianceamplipi.health.label = Audio Health
channel-type.ambianceamplipi.health.description = "ok", or a human-readable summary of what the controller reported wrong (radio / preamp).
channel-type.ambianceamplipi.healthOk.label = Audio Health OK
channel-type.ambianceamplipi.healthOk.description = ON while the controller's audio subsystem (radio + preamp) is healthy; OFF when it needs attention.
channel-type.ambianceamplipi.nowArtist.label = Artist
channel-type.ambianceamplipi.nowArtist.description = Current artist (parsed from the stream title).
channel-type.ambianceamplipi.nowTitle.label = Now playing
channel-type.ambianceamplipi.nowTitle.description = Current stream title (e.g. "Artist - Track").
channel-type.ambianceamplipi.nowTrack.label = Track
channel-type.ambianceamplipi.nowTrack.description = Current track (parsed from the stream title).
channel-type.ambianceamplipi.siren.label = Siren
channel-type.ambianceamplipi.siren.description = Burglar siren: ON drives all zones to full and loops the alarm; OFF restores.
channel-type.ambianceamplipi.source.label = Source
channel-type.ambianceamplipi.source.description = The playback source that owns the audio path (radio, spotify, ...). Options come from the controller's source list; selecting one switches to and starts it.
channel-type.ambianceamplipi.station.label = Station
channel-type.ambianceamplipi.station.description = The radio station that is playing. Options come from the controller's station list.
